<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container mt-3">
                <h2>a)</h2>
                <div class="mb-3">
                    <label for="" class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        name=""
                        id=""
                        aria-describedby="emailHelpId"
                        placeholder="Email"
                    />
                    <small id="emailHelpId" class="form-text text-body-secondary"
                        >Help text</small
                    >
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        name=""
                        id=""
                        placeholder="Password"
                    />
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="myCheck" name="remember" required />
                    <label class="form-check-label" for="myCheck"> Remember me </label>
                </div>
    
                
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                   Sign in
                </button>

                <h2>b) Textarea</h2>
                <div class="mb-3">
                    <label for="" class="form-label">Bình Luận:</label>
                    <textarea class="form-control" name="" id="" rows="7"></textarea>
                </div>
                
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                  Gửi
                </button>
                
                
                
                
                
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
