<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
       
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
           <div class="container">
                <h3>a) Định nghĩa các Class Button</h3>
               <button type="button" class="btn btn-default">
                    default button
               </button>

               <button class="btn btn-primary">
                    primary button
               </button>

                <button type="button" class="btn btn-success">
                    Success button
               </button>

                <button type="button" class="btn btn-info">
                    Info button
               </button>
                <button type="button" class="btn btn-warning">
                    Warning button
               </button>

                <button type="button" class="btn btn-danger">
                    Danger button
               </button>

                <a href="#" type="button" class="btn btn-link">
                    Link button
               </a>


                <h3>b) Button với đường viền</h3>
                <button type="button" class="btn btn-outline-primary">
                    primary button
               </button>

                <button type="button" class="btn btn-outline-secondary">
                   Secondary button
               </button>

                <button type="button" class="btn btn-outline-success">
                    Success button
               </button>
                <button type="button" class="btn btn-outline-info">
                    Info button
               </button>

                <button type="button" class="btn btn-outline-warning">
                    Warning button
               </button>

                 <button type="button" class="btn btn-outline-danger">
                    Danger button
               </button>

                 <button type="button" class="btn btn-outline-dark">
                    Dark button
               </button>

                 <button type="button" class="text-dark btn btn-outline-light" >
                    Light button
               </button>
               <h3>c) Kích thước của button</h3>

             <button type="button" class="btn btn-success btn-lg">
                   Nút to
               </button>

                <button type="button" class="btn btn-success">
                    Kích thước mặc định
               </button>

                <button type="button" class="btn btn-success btn-sm">
                   Nút nhỏ
               </button>

               

               <h3>d) Thành phần của button</h3>
                <button type="button" class="btn btn-success">
                    Button chứa link
               </button>

               <input type="button" class="btn btn-info" value="Button">

              <input
                name=""
                id=""
                class="btn btn-primary"
                type="button"
                value="Input Button"
              />

               <input type="submit" class="btn btn-warning" value=" Submit Button">

               <h3>e) Trạng thái của nút</h3>
                <button type="button" class="btn btn-success">
                    Nút bình thường
               </button>

                <button type="button" class="btn btn-info">
                    Nút có thể Click
               </button>

               <button type="button" class="btn btn-warning" disabled>
                    Nút không thể click
               </button>

               <h3>f) Nút đang load</h3>

               <button class="btn btn-primary">
                    <span class="spinner-border"></span>
               </button>

               <button class="btn btn-primary">
                    <span class="spinner-border"></span>
                   Loading..
               </button>

                <button class="btn btn-primary" disabled>
                    <span class="spinner-border"></span>
                   Loading..
               </button>

               <button class="btn btn-primary" disabled>
                    <span class="spinner-grow"></span>
                   Loading..
               </button>
           </div>

          
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
